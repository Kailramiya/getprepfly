<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prepfly — Ad Banners</title>
<style>
  body { margin:0; font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif; background:#f1f5f9; color:#0f172a; }
  header { padding:24px 28px; }
  h1 { margin:0; font-size:20px; }
  p { margin:6px 0 0; color:#64748b; font-size:14px; }
  .grid { display:flex; flex-wrap:wrap; gap:24px; padding:8px 28px 40px; align-items:flex-start; }
  figure { margin:0; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px; }
  figure img { display:block; border-radius:8px; }
  figcaption { margin-top:10px; font-size:13px; color:#475569; display:flex; justify-content:space-between; gap:12px; }
  a { color:#4f46e5; text-decoration:none; font-weight:600; }
  .sq img { width:340px; height:340px; }
  .wd img { width:520px; height:273px; }
  .st img { width:230px; height:409px; }
</style>
</head>
<body>
<header>
  <h1>Prepfly — advertising banners</h1>
  <p>Right-click an image → “Save image as…”, or download the PNG/SVG links. SVGs are editable & infinitely scalable.</p>
</header>
<div class="grid">
  <figure class="sq">
    <img src="./prepfly-ad-square-1080.png" alt="Square banner 1080×1080" />
    <figcaption><span>Square · 1080×1080 (Instagram post / WhatsApp)</span>
      <span><a href="./prepfly-ad-square-1080.png" download>PNG</a> · <a href="./prepfly-ad-square-1080.svg" download>SVG</a></span></figcaption>
  </figure>
  <figure class="st">
    <img src="./prepfly-ad-story-1080x1920.png" alt="Story banner 1080×1920" />
    <figcaption><span>Story · 1080×1920 (IG/WA status)</span>
      <span><a href="./prepfly-ad-story-1080x1920.png" download>PNG</a> · <a href="./prepfly-ad-story-1080x1920.svg" download>SVG</a></span></figcaption>
  </figure>
  <figure class="wd">
    <img src="./prepfly-ad-wide-1200x630.png" alt="Wide banner 1200×630" />
    <figcaption><span>Wide · 1200×630 (Facebook / link preview)</span>
      <span><a href="./prepfly-ad-wide-1200x630.png" download>PNG</a> · <a href="./prepfly-ad-wide-1200x630.svg" download>SVG</a></span></figcaption>
  </figure>
</div>
</body>
</html>
