      <path fill="#F59E0B" d="M0,7.5 L-2.2,2.2 L0,0 L2.2,2.2 Z"/>
      <path fill="#F59E0B" d="M-7.5,0 L-2.2,-2.2 L0,0 L-2.2,2.2 Z"/>
