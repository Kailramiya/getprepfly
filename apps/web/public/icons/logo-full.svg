    <path fill="url(#lpg)" d="M7,7 L7,90 L21,90 L21,51 L37,51 Q67,51 67,29 Q67,7 37,7 Z"/>
    <circle cx="37" cy="29" r="14" fill="rgba(255,255,255,0.13)"/>
    <!-- Compass -->
    <g transform="translate(37,29)">
      <path fill="url(#lgg)" d="M0,-11 L3.5,-3.5 L0,0 L-3.5,-3.5 Z"/>
      <path fill="url(#lgg)" d="M11,0 L3.5,3.5 L0,0 L3.5,-3.5 Z"/>
