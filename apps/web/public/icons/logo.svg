<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="PrepFly">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0EA5E9"/>
      <stop offset="50%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="gg" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wings: 3 feathers sweeping right from P bowl -->
  <path fill="url(#wg)" d="M57,9 C71,0 91,4 97,14 C91,23 72,23 58,27 Q53,25 54,17 Z"/>
  <path fill="url(#wg)" opacity="0.8" d="M57,20 C72,12 92,18 97,29 C91,37 72,37 58,39 Q53,37 54,28 Z"/>
  <path fill="url(#wg)" opacity="0.58" d="M56,31 C70,25 90,33 94,45 C88,52 70,51 57,49 Q52,47 53,39 Z"/>

  <!-- P letter (solid fill) -->
  <path fill="url(#pg)" d="M7,7 L7,91 L21,91 L21,52 L37,52 Q68,52 68,29 Q68,7 37,7 Z"/>

  <!-- Soft glow behind compass -->
  <circle cx="37" cy="29" r="16" fill="rgba(255,255,255,0.18)"/>

  <!-- Compass Rose at (37, 29) -->
  <g transform="translate(37,29)">
    <path fill="url(#gg)" d="M0,-13 L4,-4 L0,0 L-4,-4 Z"/>
    <path fill="url(#gg)" d="M13,0 L4,4 L0,0 L4,-4 Z"/>
    <path fill="url(#gg)" d="M0,13 L-4,4 L0,0 L4,4 Z"/>
    <path fill="url(#gg)" d="M-13,0 L-4,-4 L0,0 L-4,4 Z"/>
    <path fill="#FCD34D" d="M9.2,-9.2 L2.6,-2.6 L0,0 L-2.6,-2.6 Z"/>
    <path fill="#FCD34D" d="M9.2,9.2 L2.6,2.6 L0,0 L2.6,-2.6 Z"/>
    <path fill="#FCD34D" d="M-9.2,9.2 L-2.6,2.6 L0,0 L2.6,2.6 Z"/>
    <path fill="#FCD34D" d="M-9.2,-9.2 L-2.6,-2.6 L0,0 L-2.6,2.6 Z"/>
    <circle r="4.5" fill="#F59E0B"/>
    <circle r="2.2" fill="#FEFCE8"/>
  </g>

  <!-- Gold arc: compass → star -->
  <path stroke="#FBBF24" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.75"
        d="M49,20 C64,8 80,6 91,9"/>

  <!-- Gold sparkle star at wing tip -->
  <g transform="translate(94,11)" filter="url(#glow)">
    <circle r="8" fill="#FCD34D" opacity="0.25"/>
    <path fill="#F59E0B" d="M0,-9 L2.5,-2.5 L0,0 L-2.5,-2.5 Z"/>
    <path fill="#F59E0B" d="M9,0 L2.5,2.5 L0,0 L2.5,-2.5 Z"/>
    <path fill="#F59E0B" d="M0,9 L-2.5,2.5 L0,0 L2.5,2.5 Z"/>
    <path fill="#F59E0B" d="M-9,0 L-2.5,-2.5 L0,0 L-2.5,2.5 Z"/>
    <circle r="3.2" fill="#FEF9C3"/>
  </g>

  <!-- Book pages at P base -->
  <rect x="7" y="84" width="30" height="2.6" rx="1.2" fill="#0D9488" opacity="0.60"/>
  <rect x="7" y="88" width="25" height="2.6" rx="1.2" fill="#0EA5E9" opacity="0.46"/>
  <rect x="7" y="92" width="20" height="2.6" rx="1.2" fill="#3B82F6" opacity="0.34"/>

  <!-- Circuit traces -->
  <path stroke="#0D9488" stroke-width="1" fill="none" opacity="0.4"
        d="M39,84 L46,84 L46,76 M52,84 L58,84 L58,78"/>
  <circle cx="46" cy="76" r="1.8" fill="#0D9488" opacity="0.4"/>
  <circle cx="58" cy="78" r="1.8" fill="#0D9488" opacity="0.4"/>
  <circle cx="64" cy="84" r="1.2" fill="#0D9488" opacity="0.3"/>
</svg>
